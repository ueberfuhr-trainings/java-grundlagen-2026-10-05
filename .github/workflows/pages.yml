name: Publish Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygments markdown

      - name: Get merged PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list \
            --state merged \
            --limit 1000 \
            --json number,title,mergeCommit,mergedAt \
            > "$RUNNER_TEMP/merged-prs.json"

      - name: Validate generator
        run: python -m py_compile .github/pages/generate.py

      - name: Generate site
        run: python .github/pages/generate.py --with-prs

      - name: Download Bootstrap
        run: |
          mkdir -p _site/assets
          curl --fail --location \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css \
            --output _site/assets/bootstrap.min.css
          curl --fail --location \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js \
            --output _site/assets/bootstrap.bundle.min.js

      - name: Verify generated site
        run: |
          test -f _site/index.html
          test -f _site/style.css
          test -f _site/site.js
          test -f _site/assets/bootstrap.min.css
          test -f _site/assets/bootstrap.bundle.min.js
          test ! -f _site/merged-prs.json

          echo "Generated files:"
          find _site -maxdepth 4 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
