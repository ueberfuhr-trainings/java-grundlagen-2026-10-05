name: Publish Java project to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygments markdown

      - name: Get merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list \
            --state merged \
            --limit 1000 \
            --json number,title,mergeCommit,mergedAt \
            > "$RUNNER_TEMP/merged-prs.json"

      - name: Validate generator
        run: |
          python -m py_compile .github/pages/generate.py

      - name: Generate Pages site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python .github/pages/generate.py

      - name: Download Bootstrap
        run: |
          mkdir -p _site/assets

          curl -fL \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css \
            -o _site/assets/bootstrap.min.css

          curl -fL \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js \
            -o _site/assets/bootstrap.bundle.min.js

      - name: Verify generated site
        run: |
          test -d _site
          test -f _site/index.html
          test -f _site/assets/bootstrap.min.css
          test -f _site/assets/bootstrap.bundle.min.js
          test ! -f _site/merged-prs.json

          echo "Generated files:"
          find _site -maxdepth 3 -type f | sort | head -200

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
