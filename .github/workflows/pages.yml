name: Publish Java project to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Repository
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pygments markdown

      - name: Validate generator
        run: python -m py_compile .github/pages/generate.py

      # ------------------------------------------------------------
      # Merged PRs ermitteln
      # ------------------------------------------------------------

      - name: Get merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list \
            --state merged \
            --limit 1000 \
            --json number,title,mergeCommit,mergedAt \
            > "$RUNNER_TEMP/merged-prs.json"

          echo "Merged pull requests:"
          cat "$RUNNER_TEMP/merged-prs.json"

          echo
          echo "Found $(jq length "$RUNNER_TEMP/merged-prs.json") merged pull requests."


      # ------------------------------------------------------------
      # Website generieren
      # ------------------------------------------------------------

      - name: Generate website
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python .github/pages/generate.py


      # ------------------------------------------------------------
      # Bootstrap lokal in die Pages-Seite kopieren
      #
      # Dadurch benötigen die Lernenden keinen Zugriff auf
      # jsdelivr.net.
      # ------------------------------------------------------------

      - name: Download Bootstrap
        run: |
          mkdir -p _site/assets

          curl -L \
            --fail \
            --silent \
            --show-error \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css \
            -o _site/assets/bootstrap.min.css

          curl -L \
            --fail \
            --silent \
            --show-error \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js \
            -o _site/assets/bootstrap.bundle.min.js


      # ------------------------------------------------------------
      # Kontrolle
      # ------------------------------------------------------------

      - name: Verify generated website
        run: |
          echo "Generated website:"
          find _site -type f | sort

          echo
          echo "Checking for accidentally published metadata..."

          if [ -f "_site/merged-prs.json" ]; then
            echo "ERROR: merged-prs.json must not be published."
            exit 1
          fi

          echo
          echo "Checking Bootstrap..."

          test -f "_site/assets/bootstrap.min.css"
          test -f "_site/assets/bootstrap.bundle.min.js"

          echo
          echo "Checking main page..."

          test -f "_site/index.html"

          echo
          echo "OK."


      # ------------------------------------------------------------
      # GitHub Pages
      # ------------------------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
