name: Publish Maven project to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout complete repository history.
      #
      # Historical PR pages are generated from their merge commits.
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Configure GitHub Pages
      # ============================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # Download Bootstrap locally.
      #
      # Bootstrap is therefore part of the generated GitHub Pages
      # website and is NOT loaded by learners from a CDN.
      # ============================================================

      - name: Download Bootstrap
        run: |
          mkdir -p _site/assets

          curl -L \
            --fail \
            --silent \
            --show-error \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css \
            -o _site/assets/bootstrap.min.css

          curl -L \
            --fail \
            --silent \
            --show-error \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js \
            -o _site/assets/bootstrap.bundle.min.js

      # ============================================================
      # Install Python packages used by the generator.
      # ============================================================

      - name: Install website generator
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pygments markdown

      # ============================================================
      # Get merged pull requests.
      #
      # IMPORTANT:
      # merged-prs.json is created outside the source project and
      # will never be copied into the generated website.
      # ============================================================

      - name: Get merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --limit 1000 \
            --json number,title,mergeCommit,mergedAt \
            > "$RUNNER_TEMP/merged-prs.json"

          echo "Merged PRs:"
          cat "$RUNNER_TEMP/merged-prs.json"

      # ============================================================
      # Generate complete static website.
      # ============================================================

      - name: Generate website
        env:
          PR_DATA_FILE: ${{ runner.temp }}/merged-prs.json
        shell: python
        run: |

          import json
          import os
          import shutil
          import subprocess
          from html import escape
          from pathlib import Path

          import markdown

          from pygments import highlight
          from pygments.formatters import HtmlFormatter
          from pygments.lexers import (
              TextLexer,
              get_lexer_for_filename
          )


          # ==========================================================
          # Paths
          # ==========================================================

          SOURCE = Path(".").resolve()
          SITE = SOURCE / "_site"

          PR_DATA = Path(
              os.environ["PR_DATA_FILE"]
          )


          # ==========================================================
          # Clean generated site.
          #
          # Bootstrap was downloaded into _site/assets before this
          # step, so remember it and download it again afterwards.
          # ==========================================================

          if SITE.exists():
              shutil.rmtree(SITE)

          SITE.mkdir(parents=True)


          # ==========================================================
          # Project files which must NOT appear on the website.
          # ==========================================================

          EXCLUDED_DIRS = {
              ".git",
              ".github",
              ".idea",
              ".vscode",
              "target",
              "_site",
              "node_modules",
          }

          EXCLUDED_FILES = {
              ".gitignore",
              ".gitattributes",
              ".gitmodules",
              "merged-prs.json",
          }


          # ==========================================================
          # Pygments configuration
          # ==========================================================

          formatter = HtmlFormatter(
              style="default",
              linenos=True,
              cssclass="highlight"
          )

          PYGMENTS_CSS = formatter.get_style_defs(
              ".highlight"
          )


          # ==========================================================
          # Custom CSS
          #
          # Bootstrap handles the general layout.
          # This CSS only handles source-code specific details.
          # ==========================================================

          CSS = f"""
          body {{
              background-color: #f8f9fa;
          }}

          .app-content {{
              min-width: 0;
          }}

          .source-container {{
              border: 1px solid #dee2e6;
              border-radius: .5rem;
              overflow: auto;
              background: #f8f9fa;
          }}

          .highlight {{
              margin: 0;
              padding: 0;
              font-size: .9rem;
              line-height: 1.5;
          }}

          .highlight pre {{
              margin: 0;
              padding: 1rem;
          }}

          .highlighttable {{
              width: 100%;
              border-collapse: collapse;
          }}

          .highlighttable td {{
              padding: 0;
          }}

          .highlighttable .linenos {{
              user-select: none;
              color: #6c757d;
              text-align: right;
              padding: 1rem .75rem;
              border-right: 1px solid #dee2e6;
              background: #f1f3f5;
          }}

          .highlighttable .code {{
              width: 100%;
          }}

          .highlighttable .code pre {{
              padding-left: 1rem;
          }}

          .markdown-body {{
              max-width: 950px;
          }}

          .markdown-body img {{
              max-width: 100%;
          }}

          .markdown-body pre {{
              background: #f8f9fa;
              padding: 1rem;
              overflow-x: auto;
              border-radius: .5rem;
          }}

          .markdown-body code {{
              background: #f1f3f5;
              padding: .15rem .3rem;
              border-radius: .25rem;
          }}

          .markdown-body pre code {{
              background: transparent;
              padding: 0;
          }}

          .file-list .list-group-item {{
              transition: background-color .1s ease;
          }}

          .file-list .list-group-item:hover {{
              background-color: #f8f9fa;
          }}

          .version-select {{
              min-width: 360px;
          }}

          @media (max-width: 576px) {{
              .version-select {{
                  min-width: 100%;
              }}
          }}

          {PYGMENTS_CSS}
          """

          (SITE / "style.css").write_text(
              CSS,
              encoding="utf-8"
          )


          # ==========================================================
          # Utility functions
          # ==========================================================

          def relative_url(
              from_dir: Path,
              target: Path
          ):

              import os

              return Path(
                  os.path.relpath(
                      target,
                      from_dir
                  )
              ).as_posix()


          def collect_children(
              directory: Path
          ):

              children = []

              for child in directory.iterdir():

                  if child.name.startswith("."):
                      continue

                  if child.name in EXCLUDED_FILES:
                      continue

                  if (
                      child.is_dir()
                      and child.name in EXCLUDED_DIRS
                  ):
                      continue

                  children.append(child)

              return sorted(
                  children,
                  key=lambda p: (
                      not p.is_dir(),
                      p.name.lower()
                  )
              )


          def find_lexer(path: Path):

              try:
                  return get_lexer_for_filename(
                      path.name,
                      stripnl=False,
                      stripall=False
                  )

              except Exception:
                  return TextLexer()


          def source_html(path: Path):

              try:
                  content = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )

              except Exception:
                  content = (
                      "(Datei konnte nicht gelesen werden.)"
                  )

              return highlight(
                  content,
                  find_lexer(path),
                  formatter
              )


          # ==========================================================
          # Determine GitHub Pages base URL.
          #
          # Example:
          #
          # https://user.github.io/repository/
          #
          # The generated pages must work from any subdirectory.
          # ==========================================================

          repository = os.environ["GITHUB_REPOSITORY"]

          owner, repo = repository.split("/", 1)

          PAGES_BASE = f"/{repo}/"


          # ==========================================================
          # Page template
          # ==========================================================

          def page_template(
              title,
              breadcrumb,
              sidebar,
              body,
              current_snapshot
          ):

              return f"""<!doctype html>

          <html lang="de">

          <head>

              <meta charset="utf-8">

              <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1"
              >

              <title>{escape(title)}</title>

              <link
                  rel="stylesheet"
                  href="{PAGES_BASE}assets/bootstrap.min.css"
              >

              <link
                  rel="stylesheet"
                  href="{PAGES_BASE}style.css"
              >

          </head>

          <body>

          <!-- =====================================================
               Navigation
               ===================================================== -->

          <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

              <div class="container-fluid">

                  <a
                      class="navbar-brand fw-semibold"
                      href="{PAGES_BASE}index.html"
                  >
                      📚 Maven-Projekt
                  </a>

                  <button
                      class="navbar-toggler"
                      type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#mainNavbar"
                      aria-controls="mainNavbar"
                      aria-expanded="false"
                      aria-label="Navigation anzeigen"
                  >
                      <span class="navbar-toggler-icon"></span>
                  </button>


                  <div
                      class="collapse navbar-collapse"
                      id="mainNavbar"
                  >

                      <div class="ms-auto d-flex align-items-center gap-2">

                          <label
                              for="versionSelector"
                              class="text-light mb-0"
                          >
                              Version:
                          </label>

                          <select
                              id="versionSelector"
                              class="form-select form-select-sm version-select"
                          >
                              {build_version_options(
                                  current_snapshot
                              )}
                          </select>

                      </div>

                  </div>

              </div>

          </nav>


          <!-- =====================================================
               Main layout
               ===================================================== -->

          <div class="container-fluid">

              <div class="row">

                  <!-- Sidebar -->

                  <aside
                      class="col-lg-3 col-xl-2 border-end bg-light"
                  >

                      <div
                          class="p-3 sticky-lg-top"
                          style="top: 0;"
                      >

                          <div class="small text-secondary mb-2">
                              Projektstruktur
                          </div>

                          {sidebar}

                      </div>

                  </aside>


                  <!-- Content -->

                  <main class="col-lg-9 col-xl-10 app-content">

                      <div class="container-fluid py-4">

                          <div class="mb-3 text-secondary small">
                              {breadcrumb}
                          </div>

                          {body}

                      </div>

                  </main>

              </div>

          </div>


          <!-- =====================================================
               Bootstrap JavaScript
               ===================================================== -->

          <script
              src="{PAGES_BASE}assets/bootstrap.bundle.min.js"
          ></script>


          <!-- =====================================================
               Version selector
               ===================================================== -->

          <script>

              document
                  .getElementById("versionSelector")
                  .addEventListener("change", function () {{

                      const url = this.value;

                      if (url) {{
                          window.location.href = url;
                      }}

                  }});

          </script>

          </body>

          </html>
          """


          # ==========================================================
          # Version selector
          # ==========================================================

          merged_prs = []

          with PR_DATA.open(
              encoding="utf-8"
          ) as f:

              pull_requests = json.load(f)


          for pr in pull_requests:

              merge_commit = pr.get("mergeCommit")

              if not merge_commit:
                  continue

              sha = merge_commit.get("oid")

              if not sha:
                  continue

              merged_prs.append({
                  "number": pr["number"],
                  "title": pr["title"],
                  "sha": sha,
                  "mergedAt": pr.get("mergedAt"),
              })


          # Newest merge first.
          merged_prs.sort(
              key=lambda x: x.get("mergedAt") or "",
              reverse=True
          )


          def build_version_options(
              current_snapshot
          ):

              options = []

              selected = (
                  "selected"
                  if current_snapshot == "main"
                  else ""
              )

              options.append(
                  f"""
                  <option
                      value="{PAGES_BASE}index.html"
                      {selected}
                  >
                      main – aktueller Stand
                  </option>
                  """
              )

              for pr in merged_prs:

                  number = pr["number"]
                  title = pr["title"]

                  selected = (
                      "selected"
                      if (
                          current_snapshot
                          == f"pr/{number}"
                      )
                      else ""
                  )

                  options.append(
                      f"""
                      <option
                          value="{PAGES_BASE}pr/{number}/index.html"
                          {selected}
                      >
                          PR #{number} – {escape(title)}
                      </option>
                      """
                  )

              return "".join(options)


          # ==========================================================
          # Generate snapshot
          # ==========================================================

          def generate_snapshot(
              source_root: Path,
              output_root: Path,
              title: str,
              subtitle: str,
              snapshot_id: str
          ):

              if output_root.exists():
                  shutil.rmtree(output_root)

              output_root.mkdir(
                  parents=True,
                  exist_ok=True
              )


              # ------------------------------------------------------
              # Navigation
              # ------------------------------------------------------

              def navigation(
                  directory: Path,
                  current_output_directory: Path
              ):

                  def render(
                      current_directory: Path
                  ):

                      items = []

                      for child in collect_children(
                          current_directory
                      ):

                          if child.is_dir():

                              target = (
                                  output_root
                                  / child.relative_to(
                                      source_root
                                  )
                                  / "index.html"
                              )

                              href = relative_url(
                                  current_output_directory,
                                  target
                              )

                              nested = render(child)

                              items.append(
                                  f"""
                                  <li class="mb-1">

                                      <a
                                          class="text-decoration-none"
                                          href="{href}"
                                      >
                                          📁
                                          {escape(child.name)}
                                      </a>

                                      {nested}

                                  </li>
                                  """
                              )

                          else:

                              target = (
                                  output_root
                                  / child.relative_to(
                                      source_root
                                  )
                              ).with_suffix(".html")

                              href = relative_url(
                                  current_output_directory,
                                  target
                              )

                              items.append(
                                  f"""
                                  <li class="mb-1">

                                      <a
                                          class="text-decoration-none"
                                          href="{href}"
                                      >
                                          📄
                                          {escape(child.name)}
                                      </a>

                                  </li>
                                  """
                              )


                      if not items:
                          return ""

                      return (
                          '<ul class="list-unstyled ms-2">'
                          + "".join(items)
                          + "</ul>"
                      )


                  return render(directory)


              # ------------------------------------------------------
              # Directory page
              # ------------------------------------------------------

              def generate_directory(
                  directory: Path
              ):

                  relative = directory.relative_to(
                      source_root
                  )

                  output_dir = (
                      output_root / relative
                  )

                  output_dir.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  output_file = (
                      output_dir / "index.html"
                  )

                  entries = []


                  # Parent link

                  if relative != Path("."):

                      parent_output = (
                          output_root
                          / directory.parent.relative_to(
                              source_root
                          )
                          / "index.html"
                      )

                      entries.append(
                          f"""
                          <a
                              class="list-group-item list-group-item-action"
                              href="{relative_url(
                                  output_dir,
                                  parent_output
                              )}"
                          >
                              ↩️ Übergeordnetes Verzeichnis
                          </a>
                          """
                      )


                  # Children

                  for child in collect_children(
                      directory
                  ):

                      if child.is_dir():

                          target = (
                              output_root
                              / child.relative_to(
                                  source_root
                              )
                              / "index.html"
                          )

                          href = relative_url(
                              output_dir,
                              target
                          )

                          entries.append(
                              f"""
                              <a
                                  class="list-group-item
                                         list-group-item-action"
                                  href="{href}"
                              >
                                  📁
                                  <span class="fw-semibold">
                                      {escape(child.name)}
                                  </span>
                              </a>
                              """
                          )

                      else:

                          target = (
                              output_root
                              / child.relative_to(
                                  source_root
                              )
                          ).with_suffix(".html")

                          href = relative_url(
                              output_dir,
                              target
                          )

                          entries.append(
                              f"""
                              <a
                                  class="list-group-item
                                         list-group-item-action"
                                  href="{href}"
                              >
                                  📄
                                  {escape(child.name)}
                              </a>
                              """
                          )


                  path_text = (
                      "/"
                      if relative == Path(".")
                      else "/" + relative.as_posix() + "/"
                  )


                  body = f"""

                  <div class="d-flex
                              flex-wrap
                              justify-content-between
                              align-items-start
                              gap-3
                              mb-4">

                      <div>

                          <h1 class="h2 mb-2">
                              {escape(title)}
                          </h1>

                          {subtitle}

                      </div>

                  </div>


                  <div class="card shadow-sm">

                      <div class="card-header">
                          <code>
                              {escape(path_text)}
                          </code>
                      </div>

                      <div class="list-group list-group-flush">

                          {"".join(entries)}

                      </div>

                  </div>

                  """


                  sidebar = navigation(
                      directory,
                      output_dir
                  )


                  output_file.write_text(
                      page_template(
                          title,
                          escape(path_text),
                          sidebar,
                          body,
                          snapshot_id
                      ),
                      encoding="utf-8"
                  )


              # ------------------------------------------------------
              # File page
              # ------------------------------------------------------

              def generate_file(
                  path: Path
              ):

                  relative = path.relative_to(
                      source_root
                  )

                  output_file = (
                      output_root / relative
                  ).with_suffix(".html")

                  output_file.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )


                  # README

                  if path.name.lower() == "readme.md":

                      source = path.read_text(
                          encoding="utf-8",
                          errors="replace"
                      )

                      html = markdown.markdown(
                          source,
                          extensions=[
                              "fenced_code",
                              "tables",
                              "toc",
                          ]
                      )

                      body = f"""

                      <div class="card shadow-sm">

                          <div class="card-header">
                              📖 {escape(path.name)}
                          </div>

                          <div class="card-body markdown-body">

                              {html}

                          </div>

                      </div>

                      """


                  # Source code

                  else:

                      highlighted = source_html(
                          path
                      )

                      body = f"""

                      <div class="d-flex
                                  justify-content-between
                                  align-items-center
                                  flex-wrap
                                  gap-2
                                  mb-3">

                          <div>

                              <h1 class="h3 mb-1">
                                  {escape(path.name)}
                              </h1>

                              <div class="text-secondary">
                                  <code>
                                      {escape(
                                          relative.as_posix()
                                      )}
                                  </code>
                              </div>

                          </div>

                          <span class="badge text-bg-secondary">
                              Quellcode
                          </span>

                      </div>


                      <div class="source-container shadow-sm">

                          {highlighted}

                      </div>

                      """


                  sidebar = navigation(
                      path.parent,
                      output_file.parent
                  )


                  output_file.write_text(
                      page_template(
                          path.name,
                          escape(
                              "/" + relative.as_posix()
                          ),
                          sidebar,
                          body,
                          snapshot_id
                      ),
                      encoding="utf-8"
                  )


              # ------------------------------------------------------
              # Find files
              # ------------------------------------------------------

              directories = []
              files = []

              for path in source_root.rglob("*"):

                  relative_parts = path.relative_to(
                      source_root
                  ).parts

                  if any(
                      part in EXCLUDED_DIRS
                      for part in relative_parts
                  ):
                      continue

                  if path.name.startswith("."):
                      continue

                  if path.is_dir():

                      directories.append(path)

                  elif path.is_file():

                      if path.name not in EXCLUDED_FILES:

                          files.append(path)


              for directory in sorted(
                  directories,
                  key=lambda p: len(p.parts)
              ):

                  generate_directory(
                      directory
                  )


              for path in files:

                  generate_file(
                      path
                  )


              generate_directory(
                  source_root
              )


          # ==========================================================
          # Bootstrap was downloaded before the generator cleaned
          # _site. Download it again after generation.
          # ==========================================================

          # ==========================================================
          # Current main
          # ==========================================================

          print(
              "Generating current main version..."
          )

          generate_snapshot(
              SOURCE,
              SITE,
              "Maven-Projekt",
              """
              <p class="text-secondary mb-0">
                  <span class="badge text-bg-primary">
                      main
                  </span>

                  Aktueller Stand des Projekts.
              </p>
              """,
              "main"
          )


          # ==========================================================
          # Historical PR snapshots
          # ==========================================================

          pr_root = SITE / "pr"

          pr_root.mkdir(
              parents=True,
              exist_ok=True
          )


          print()
          print(
              f"Found {len(merged_prs)} merged pull requests."
          )


          for pr in merged_prs:

              number = pr["number"]
              title = pr["title"]
              sha = pr["sha"]
              merged_at = pr.get(
                  "mergedAt"
              ) or ""


              print(
                  f"Generating PR #{number}: "
                  f"{title}"
              )


              temp_dir = (
                  SOURCE / ".snapshot"
              )

              if temp_dir.exists():
                  shutil.rmtree(temp_dir)

              temp_dir.mkdir()


              # Extract exact merge commit.

              archive = subprocess.run(
                  [
                      "git",
                      "archive",
                      sha
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True
              )


              subprocess.run(
                  [
                      "tar",
                      "-x",
                      "-C",
                      str(temp_dir)
                  ],
                  input=archive.stdout,
                  check=True
              )


              output_dir = (
                  pr_root / str(number)
              )


              subtitle = f"""

              <p class="text-secondary">

                  <span class="badge text-bg-success">
                      Stand nach Merge
                  </span>

              </p>


              <div class="card mb-4">

                  <div class="card-body">

                      <h2 class="h5">
                          PR #{number}
                      </h2>

                      <p class="mb-2">
                          {escape(title)}
                      </p>

                      <dl class="row mb-0 small">

                          <dt class="col-sm-3">
                              Merge-Commit
                          </dt>

                          <dd class="col-sm-9">
                              <code>
                                  {escape(sha)}
                              </code>
                          </dd>

                          <dt class="col-sm-3">
                              Gemergt
                          </dt>

                          <dd class="col-sm-9">
                              {escape(merged_at)}
                          </dd>

                      </dl>

                  </div>

              </div>

              """


              generate_snapshot(
                  temp_dir,
                  output_dir,
                  f"PR #{number} – {title}",
                  subtitle,
                  f"pr/{number}"
              )


              shutil.rmtree(
                  temp_dir
              )


          # ==========================================================
          # Create main landing page
          # ==========================================================

          cards = []


          for pr in merged_prs:

              number = pr["number"]
              title = pr["title"]
              merged_at = pr.get(
                  "mergedAt"
              ) or ""


              cards.append(
                  f"""

                  <div class="col">

                      <div class="card h-100 shadow-sm">

                          <div class="card-body">

                              <div class="small text-secondary">
                                  PR #{number}
                              </div>

                              <h2 class="h5 card-title">
                                  {escape(title)}
                              </h2>

                              <p class="card-text small text-secondary">
                                  Gemergt: {escape(merged_at)}
                              </p>

                              <a
                                  class="btn btn-outline-primary btn-sm"
                                  href="pr/{number}/index.html"
                              >
                                  Stand ansehen
                              </a>

                          </div>

                      </div>

                  </div>

                  """
              )


          if cards:

              pr_section = f"""

              <section class="mt-5">

                  <h2 class="h4 mb-3">
                      Historische Merge-Stände
                  </h2>

                  <p class="text-secondary">

                      Jeder Eintrag zeigt den vollständigen
                      Projektstand unmittelbar nach dem Merge
                      des jeweiligen Pull Requests.

                  </p>

                  <div class="row row-cols-1
                              row-cols-md-2
                              row-cols-xl-3
                              g-3">

                      {"".join(cards)}

                  </div>

              </section>

              """

          else:

              pr_section = """

              <section class="mt-5">

                  <h2 class="h4">
                      Historische Merge-Stände
                  </h2>

                  <p class="text-secondary">
                      Noch keine gemergten Pull Requests.
                  </p>

              </section>

              """


          root_body = f"""

          <div class="p-4 p-md-5
                      mb-4
                      bg-white
                      border
                      rounded-3
                      shadow-sm">

              <div class="container-fluid py-2">

                  <span class="badge text-bg-primary mb-3">
                      main
                  </span>

                  <h1 class="display-6 fw-bold">
                      Maven-Projekt
                  </h1>

                  <p class="lead text-secondary">

                      Aktueller Stand des Java-Projekts.

                  </p>

                  <div class="d-flex
                              flex-wrap
                              gap-2">

                      <a
                          class="btn btn-primary"
                          href="README.html"
                      >
                          📖 README
                      </a>

                      <a
                          class="btn btn-outline-secondary"
                          href="pom.html"
                      >
                          📦 pom.xml
                      </a>

                  </div>

              </div>

          </div>


          {pr_section}

          """


          root_sidebar = navigation(
              SOURCE,
              SITE
          )


          root_html = page_template(
              "Maven-Projekt",
              "/",
              root_sidebar,
              root_body,
              "main"
          )


          (SITE / "index.html").write_text(
              root_html,
              encoding="utf-8"
          )


          # ==========================================================
          # Download Bootstrap AFTER site generation.
          #
          # This ensures Bootstrap survives the cleanup above.
          # ==========================================================

          assets = SITE / "assets"

          assets.mkdir(
              parents=True,
              exist_ok=True
          )


          subprocess.run(
              [
                  "curl",
                  "-L",
                  "--fail",
                  "--silent",
                  "--show-error",
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css",
                  "-o",
                  str(
                      assets / "bootstrap.min.css"
                  )
              ],
              check=True
          )


          subprocess.run(
              [
                  "curl",
                  "-L",
                  "--fail",
                  "--silent",
                  "--show-error",
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js",
                  "-o",
                  str(
                      assets / "bootstrap.bundle.min.js"
                  )
              ],
              check=True
          )


          # ==========================================================
          # Final safety check:
          #
          # merged-prs.json must NEVER be inside _site.
          # ==========================================================

          unwanted = (
              SITE / "merged-prs.json"
          )

          if unwanted.exists():

              print(
                  "ERROR: merged-prs.json "
                  "would be published!"
              )

              unwanted.unlink()

              raise RuntimeError(
                  "merged-prs.json was found "
                  "inside _site."
              )


          print()
          print(
              "=============================================="
          )
          print(
              "Website generation completed successfully."
          )
          print(
              "=============================================="
          )
          print(
              f"PR snapshots: {len(merged_prs)}"
          )
          print(
              f"Output:       {SITE}"
          )


      # ============================================================
      # Upload Pages artifact
      # ============================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site


  # ================================================================
  # Deploy
  # ================================================================

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
