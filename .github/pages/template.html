<!doctype html>
<html lang="de" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__TITLE__</title>
    <script>
        // Theme vor dem ersten Rendern setzen, damit nichts hell aufblitzt:
        // gespeicherte Wahl, sonst die Systemeinstellung.
        (() => {
            let theme = null;
            try { theme = localStorage.getItem("project-theme"); } catch (_) {}
            if (theme !== "dark" && theme !== "light") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="__SITE_BASE__assets/bootstrap.min.css">
    <link rel="stylesheet" href="__SITE_BASE__style.css">
</head>
<body>
    __BODY__

    <script>
        window.VERSION_BASE = "__VERSION_BASE__";
    </script>
    <script src="__SITE_BASE__assets/bootstrap.bundle.min.js"></script>
    <script src="__SITE_BASE__site.js"></script>
</body>
</html>
